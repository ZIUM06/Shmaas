<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1023">
    <title>SHMaaS is offline</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        main {
            width: min(440px, 100%);
            padding: 36px 30px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }
        img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }
        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }
        a {
            display: inline-flex;
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 6px;
            background: #4f46e5;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img src="logo.png" alt="TVET MARA">
        <h1>You are offline</h1>
        <p>Reconnect to continue booking a hostel bed or checking your student portal.</p>
        <a href="login.html">Try again</a>
    </main>
</body>
</html>
