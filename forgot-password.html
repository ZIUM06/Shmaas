<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SHMaaS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a1023">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SHMaaS">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.22), transparent 34%),
                radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.16), transparent 30%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            padding: 2rem;
        }

        .reset-shell {
            width: 100%;
            max-width: 520px;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(99, 102, 241, 0.12);
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
            border-radius: 1.75rem;
            overflow: hidden;
        }

        .reset-hero {
            padding: 2rem 2rem 1.25rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 52%, #ec4899 100%);
            color: white;
        }

        .reset-hero .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            padding: 0.55rem 0.8rem 0.55rem 0.55rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(8px);
        }

        .reset-hero .brand img {
            width: 176px;
            height: 58px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1rem;
            padding: 0.4rem;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            flex-shrink: 0;
        }

        .reset-hero .brand span {
            font-size: 1rem;
            line-height: 1;
        }

        .reset-hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .reset-hero p {
            color: rgba(255, 255, 255, 0.88);
            max-width: 34ch;
        }

        .reset-body {
            padding: 2rem;
        }

        .reset-form {
            display: grid;
            gap: 1rem;
        }

        .reset-note {
            margin-bottom: 1.25rem;
            color: var(--gray);
            font-size: 0.98rem;
        }

        .reset-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 0.25rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 1.1rem;
            border-radius: 0.8rem;
            text-decoration: none;
            font-weight: 600;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .status-box {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 0.9rem;
            font-size: 0.95rem;
            display: none;
        }

        .status-box.show {
            display: block;
        }

        .status-box.success {
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.18);
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.1);
            color: #b91c1c;
            border: 1px solid rgba(239, 68, 68, 0.18);
        }

        @media (max-width: 640px) {
            body.auth-page {
                padding: 1rem;
            }

            .reset-hero,
            .reset-body {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }

            .reset-hero h1 {
                font-size: 1.65rem;
            }

            .reset-hero .brand {
                gap: 0.7rem;
                padding: 0.45rem 0.7rem 0.45rem 0.45rem;
            }

            .reset-hero .brand img {
                width: 140px;
                height: 50px;
            }
        }
    </style>
</head>
<body class="auth-page">
    <main class="reset-shell">
        <section class="reset-card">
            <div class="reset-hero">
                <div class="brand">
                    <img src="assets/tvet-mara-besut-logo.png" alt="TVET MARA Besut">
                    <span>SHMaaS</span>
                </div>
                <h1>Reset your password</h1>
                <p>Enter your email address and we will send you a secure password reset link.</p>
            </div>

            <div class="reset-body">
                <p class="reset-note">Use the same email you used to sign in to your hostel account.</p>

                <form id="resetForm" class="reset-form">
                    <div class="form-group">
                        <label for="resetEmail">Email</label>
                        <input type="email" id="resetEmail" placeholder="your email" autocomplete="email" required>
                    </div>

                    <div class="reset-actions">
                        <button type="submit" class="btn-auth">
                            <i class="fas fa-paper-plane"></i> Send reset link
                        </button>
                        <a href="login.html" class="btn-back">
                            <i class="fas fa-arrow-left"></i> Back to sign in
                        </a>
                    </div>
                </form>

                <div id="resetStatus" class="status-box" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail, fetchSignInMethodsForEmail, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: 'AIzaSyCB52CH0zuLg5SEfBG4eh_zpkoEfIjqfkU',
            authDomain: 'shmaas-3a0c6.firebaseapp.com',
            projectId: 'shmaas-3a0c6',
            messagingSenderId: '774113957832',
            appId: '1:774113957832:web:130f1dd20182665c49d2fd'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const USE_FIREBASE_EMULATORS = ["localhost", "127.0.0.1"].includes(window.location.hostname)
            && (
                window.location.port === "5000"
                || new URLSearchParams(window.location.search).get("emulators") === "1"
                || localStorage.getItem("shmaas_use_emulators") === "true"
            );

        if (USE_FIREBASE_EMULATORS) {
            connectAuthEmulator(auth, "http://127.0.0.1:9099");
        }

        const form = document.getElementById('resetForm');
        const emailInput = document.getElementById('resetEmail');
        const statusBox = document.getElementById('resetStatus');

        const params = new URLSearchParams(window.location.search);
        const presetEmail = params.get('email');
        if (presetEmail) {
            emailInput.value = presetEmail;
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = `status-box show ${type}`;
        }

        async function emailCanReceivePasswordReset(email) {
            const signInMethods = await fetchSignInMethodsForEmail(auth, email);
            return Array.isArray(signInMethods) && signInMethods.length > 0;
        }

        function getPasswordResetMessage(error) {
            if (error?.code === 'auth/invalid-email') {
                return 'Please enter a valid email address.';
            }

            if (error?.code === 'auth/user-not-found' || error?.code === 'auth/invalid-login-credentials') {
                return 'Email is not registered. Try a different email.';
            }

            return error?.message || 'Unable to send password reset email.';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = String(emailInput.value || '').trim().toLowerCase();
            if (!email) {
                showStatus('Please enter your email address.', 'error');
                return;
            }

            try {
                const isRegisteredEmail = await emailCanReceivePasswordReset(email);
                if (!isRegisteredEmail) {
                    showStatus('Email is not registered. Try a different email.', 'error');
                    return;
                }

                await sendPasswordResetEmail(auth, email);
                showStatus(`Password reset email sent to ${email}. Please check your inbox and spam folder.`, 'success');
                form.reset();
            } catch (error) {
                console.error('Password reset failed:', error);
                showStatus(getPasswordResetMessage(error), 'error');
            }
        });
    </script>
    <script defer src="pwa.js"></script>
</body>
</html>
